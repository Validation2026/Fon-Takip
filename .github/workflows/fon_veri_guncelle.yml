name: Fon Takip — günlük 10.00 ve 19.00 (TR)

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/**"
      - "state/**"
      - "audit/**"
  schedule:
    # 10.00 ve 19.00 Türkiye saati = 07.00 ve 16.00 UTC.
    - cron: "0 7,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-takip-autoupdate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Orijinal HTML ve SHA-256 kontrolü
        run: python scripts/bootstrap.py
      - name: Kaynak ve veri testleri
        run: python -m unittest discover -s tests -v
      - name: KAP pilot referans denetimi (orijinal odeme durumu korunur)
        continue-on-error: true
        env:
          FONOLOJI_KEY: ${{ secrets.FONOLOJI_KEY }}
        run: python scripts/kap_watch.py
      - name: Fonoloji / TEFAS veri güncelleme
        id: update
        env:
          FONOLOJI_KEY: ${{ secrets.FONOLOJI_KEY }}
          FONOLOJI_BATCH_LIMIT: ${{ github.event_name == 'push' && '20' || '400' }}
        run: |
          if [ -z "$FONOLOJI_KEY" ]; then
            echo "::error::FONOLOJI_KEY Repository Secrets altinda bulunamadi. Veri guncellemesi durduruldu."
            exit 1
          fi
          python scripts/update_rolling.py
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Doğrulanmış verileri sürümle ve Netlify deploy tetikle
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/data/fund_prices.json state/funds.json state/scan.json audit/latest.json
          if [ -f audit/kap_latest.json ]; then
            git add audit/kap_latest.json
          fi
          if [ -f public/data/kap_watch.json ]; then
            git add public/data/kap_watch.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): verified TEFAS/Fonoloji snapshot"
            git push
          else
            echo "Veride yenilik yok; gereksiz Netlify deploy yapılmadı."
          fi
